<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-_8">
    <title>シンプルな3Dデモ</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #f0f0f0; }
        canvas { display: block; }
    </style>
</head>
<body>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.164.1/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.164.1/examples/jsm/"
            }
        }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        let scene, camera, renderer, cube, controls;

        function init() {
            // 1. シーンの作成
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x222222); // 背景色を濃いグレーに

            // 2. カメラの作成
            // (視野角, アスペクト比, ニアクリップ, ファークリップ)
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 5; // カメラの位置を少し手前に

            // 3. レンダラーの作成
            renderer = new THREE.WebGLRenderer({ antialias: true }); // アンチエイリアスを有効に
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // 4. ジオメトリ（形状）とマテリアル（材質）の作成
            const geometry = new THREE.BoxGeometry(1.5, 1.5, 1.5); // 少し大きめの立方体
            // MeshStandardMaterial は光の影響を受ける材質
            const material = new THREE.MeshStandardMaterial({
                color: 0x00ff88, // 明るい緑色
                metalness: 0.5,   // 金属っぽさ
                roughness: 0.3    // 表面の粗さ
            });
            cube = new THREE.Mesh(geometry, material);
            scene.add(cube);

            // 5. 光源の追加
            // 環境光：シーン全体を均一に照らす
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5); // 白色、強度0.5
            scene.add(ambientLight);

            // 平行光源：一方向から照らす（太陽光のようなもの）
            const directionalLight = new THREE.DirectionalLight(0xffffff, 1.0); // 白色、強度1.0
            directionalLight.position.set(5, 10, 7.5); // 光源の位置
            scene.add(directionalLight);

            // 6. OrbitControls（マウス操作）の追加
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true; // 滑らかな動き（慣性）を有効にする
            controls.dampingFactor = 0.05;
            controls.screenSpacePanning = false; // パン操作を制限
            controls.minDistance = 2;  // カメラの最小ズーム距離
            controls.maxDistance = 10; // カメラの最大ズーム距離
            controls.maxPolarAngle = Math.PI / 2 + Math.PI / 4; // 上下回転の最大角度（真下より少し上まで）
            controls.minPolarAngle = Math.PI / 4; // 上下回転の最小角度（真上より少し下まで）


            // ウィンドウリサイズへの対応
            window.addEventListener('resize', onWindowResize, false);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            // 立方体を回転させる
            cube.rotation.x += 0.005;
            cube.rotation.y += 0.005;

            controls.update(); // OrbitControlsの状態を更新 (enableDamping=trueの場合に必要)
            renderer.render(scene, camera);
        }

        // 初期化関数とアニメーションループの開始
        init();
        animate();
    </script>
</body>
</html>
